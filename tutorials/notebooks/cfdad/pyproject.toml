[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfdad-workflow"
version = "0.1.0"
description = "China Forest Disturbance Attribution Dataset: RF prediction from prepared features"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy==2.2.6", "pandas==2.2.3", "pyarrow==22.0.0",
    "scikit-learn==1.7.2", "scikit-image==0.25.2", "scipy==1.15.3",
    "rasterio==1.4.4", "PyYAML==6.0.3",
]

[project.scripts]
cfdad = "cfdad.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
